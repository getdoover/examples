name: Test templates and examples

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.template }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template:
          - templates/processor
          - templates/integration
          - templates/docker-app
          - templates/report-generator
          - examples/processors/on-message-processing
          - examples/integrations/webhook-routing
          - examples/docker-apps/analog-input-scaling
          - examples/device-widgets/tag-values

    defaults:
      run:
        working-directory: ${{ matrix.template }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.template }}/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install template
        run: uv sync --locked --all-extras --dev

      - name: Run tests
        run: uv run pytest

  test-widget:
    name: examples/device-widgets/tag-values/dashboard-widget
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/device-widgets/tag-values/dashboard-widget

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/device-widgets/tag-values/dashboard-widget/package-lock.json

      - name: Install frontend
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build
