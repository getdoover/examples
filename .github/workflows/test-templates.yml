name: Test templates and examples

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.template }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template:
          - templates/processor
          - templates/integration
          - templates/docker-app
          - templates/report-generator
          - templates/widget
          - examples/processors/on-message-processing
          - examples/integrations/webhook-routing
          - examples/docker-apps/analog-input-scaling
          - examples/dashboard-widget-fleet-overview

    defaults:
      run:
        working-directory: ${{ matrix.template }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.template }}/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install template
        run: uv sync --locked --all-extras --dev

      - name: Run tests
        run: uv run pytest

  test-widget:
    name: templates/widget frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/widget

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: templates/widget/package-lock.json

      - name: Install template
        run: npm ci

      - name: Type-check template
        run: npm run check

      - name: Build template
        run: npm run build

  test-widgets:
    name: examples/dashboard-widget-fleet-overview frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: examples/dashboard-widget-fleet-overview

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/dashboard-widget-fleet-overview/package-lock.json

      - name: Install widget
        run: npm ci

      - name: Type-check widget
        run: npm run check

      - name: Build widget
        run: npm run build
