name: Test templates and examples

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.template }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template:
          - templates/processor
          - templates/integration
          - templates/docker-app
          - examples/processors/on-message-processing
          - examples/integrations/webhook-routing
          - examples/docker-apps/analog-input-scaling

    defaults:
      run:
        working-directory: ${{ matrix.template }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.template }}/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install template
        run: uv sync --locked --all-extras --dev

      - name: Run tests
        run: uv run pytest
