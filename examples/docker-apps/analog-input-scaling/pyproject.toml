[project]
name = "analog-input-scaling"
version = "0.1.0"
description = "Template for a long-running Doover Docker device app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydoover>=1.4.2",
]

[project.scripts]
doover-app-run = "analog_input_scaling:main"
export-config = "analog_input_scaling.app_config:export"
export-ui = "analog_input_scaling.app_ui:export"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analog_input_scaling"]

[dependency-groups]
dev = [
    "aiohttp>=3.11.18",
    "grpcio>=1.71.0",
    "protobuf>=6.30.2",
    "pytest>=8.3.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
