[project]
name = "webhook-routing"
version = "0.1.0"
description = "Template for a Doover webhook integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydoover>=1.4.2",
]

[project.scripts]
export-config = "webhook_routing.app_config:export"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webhook_routing"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
