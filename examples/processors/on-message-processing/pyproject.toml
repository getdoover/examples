[project]
name = "on-message-processing"
version = "0.1.0"
description = "Template for a Doover cloud processor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydoover>=1.4.2",
]

[project.scripts]
export-config = "on_message_processing.app_config:export"
export-ui = "on_message_processing.app_ui:export"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/on_message_processing"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
