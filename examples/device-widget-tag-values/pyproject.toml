[project]
name = "tag-values-device-widget"
version = "0.1.0"
description = "Device-local Doover widget for inspecting tag values"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydoover>=1.4.2"]

[project.scripts]
export-config = "tag_values_widget.app_config:export"
export-ui = "tag_values_widget.app_ui:export"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tag_values_widget"]

[dependency-groups]
dev = ["pytest>=8.3.5"]

[tool.pytest.ini_options]
pythonpath = ["src"]
