[project]
name = "processor-template"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydoover>=1.4.2"]

[project.scripts]
export-config = "processor_template.app_config:export"
export-ui = "processor_template.app_ui:export"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/processor_template"]

[dependency-groups]
dev = ["pytest>=8.3.5"]
