[project]
name = "widget-template-host"
version = "0.1.0"
description = "Companion Doover processor for the widget template"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydoover>=1.4.2"]

[project.scripts]
export-config = "widget_template.app_config:export"
export-ui = "widget_template.app_ui:export"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/widget_template"]

[dependency-groups]
dev = ["pytest>=8.3.5"]

[tool.pytest.ini_options]
pythonpath = ["src"]
