name: Test, Lint & Deploy Report Generator

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint Code
    uses: ./.github/workflows/run-linting.yml
    secrets: inherit

  test:
    name: Test Code
    uses: ./.github/workflows/run-tests.yml
    secrets: inherit

  validate:
    name: Validate Schemas
    uses: ./.github/workflows/validate-schema.yml
    secrets: inherit

  release:
    name: Release to Doover
    needs: [lint, test, validate]
    # Pull requests are prereleases and never auto-select as "Latest".
    # Pushes to main create normal production releases.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Doover CLI
        run: uv tool install doover-cli

      - name: Build the report generator package
        run: sh build.sh

      - name: Publish and release
        env:
          RELEASE_NOTES: ${{ github.event.head_commit.message || github.event.pull_request.title }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          doover app publish \
            --no-build-package \
            --commit "$COMMIT_SHA" \
            --notes "$RELEASE_NOTES" \
            ${{ github.event_name == 'pull_request' && '--alpha' || '' }}
