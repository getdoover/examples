[project]
name = "docker-app-template"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydoover>=1.4.2"]

[project.scripts]
doover-app-run = "docker_app_template:main"
export-config = "docker_app_template.app_config:export"
export-ui = "docker_app_template.app_ui:export"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docker_app_template"]

[dependency-groups]
dev = [
    "aiohttp>=3.11.18",
    "grpcio>=1.71.0",
    "protobuf>=6.30.2",
    "pytest>=8.3.5",
]
